"manifest.description" = "This plugin adds tags for traditional called folk dances from the IETF Internet-Draft (I-D) [draft-swhited-contra-tags-04](https://datatracker.ietf.org/doc/draft-swhited-contra-tags/)."
"manifest.long_description" = "This plugin adds tags for traditional called folk dances from the IETF Internet-Draft (I-D) [draft-swhited-contra-tags-04](https://datatracker.ietf.org/doc/draft-swhited-contra-tags/).\n\nThe plugin creates the tags, with descriptions, for easy lookup in the script editor only. It does not populate any of the tags. Tags include:\n\n- `dance_caller`: The name of the dance caller(s) heard in the track.\n- `dance_choreographer`: The names of the authors of the dances being called.\n- `dance_choreography`: The moves of the dance as text for called folk dances.\n- `dance_crooked`: Whether a traditional called folk dance tune is \"crooked\" (ie. not in perfect dance form).\n- `dance_form`: The form of a called dance with no particular format, eg. \"contra\" or \"square dance\" or \"duple minor improper contra\".\n- `dance_intro`: The number of intro beats before the dance or any potatoes for called folk dances.\n- `dance_issong`: Whether the track is a song (has sung vocals other than the caller) or a tune (instrumental only) for traditional music forms that make this distinction.\n- `dance_license`: Like the license field except relating to the choreography of the dance being called for called folk dances.\n- `dance_potatoes`: The number of \"potatoes\" (syncronization beats played before some traditional folk dances).\n- `dance_roles`: The role terms used for calls in a called folk dance, eg. \"Larks/Robins\" or \"Leads/Follows\" or \"Positional\".\n- `dance_start`: The start time (in milliseconds) of the first time through the dance in a called folk dance.\n- `dance_times`: The number of complete times through the dance excluding any intro, outro, or potatoes for a called folk dance. The exact definition will depend on the type of dance.\n- `dance_title`: The name of the dance(es) being called for called folk dances.'"
"manifest.name" = "Called Folk Dance Tags"
"variable.dance_caller" = "The names of the dance callers heard in the track for called folk dances."
"variable.dance_choreographer" = "The namee of the authors of the dances being called in the track for called folk dances."
"variable.dance_choreography" = "The moves of the dance as text for called folk dances. This should not include the dance title, author, or other information covered by other tags."
"variable.dance_crooked" = "Whether a traditional called folk dance tune is \"crooked\" (ie. not in perfect dance form)."
"variable.dance_form" = "The form of a called dance with no particular format, eg. \"contra\" or \"square dance\" or \"duple minor improper contra\"."
"variable.dance_intro" = "The number of intro beats before the dance or any potatoes for called folk dances."
"variable.dance_issong" = "Whether the track is a song (has sung vocals other than the caller) or a tune (instrumental only) for traditional music forms that make this distinction."
"variable.dance_license" = "Like the license field except relating to the choreography of the dance being called for called folk dances."
"variable.dance_potatoes" = "The number of \"potatoes\" (syncronization beats played before some traditional folk dances)."
"variable.dance_roles" = "The role terms used for calls in a called folk dance, eg. \"Larks/Robins\" or \"Leads/Follows\" or \"Positional\"."
"variable.dance_start" = "The start time (in milliseconds) of the first time through the dance in a called folk dance."
"variable.dance_times" = "The number of complete times through the dance excluding any intro, outro, or potatoes for a called folk dance. The exact definition will depend on the type of dance."
"variable.dance_title" = "The name of the dance or dances being called for called folk dances."
"variable.title.dance_caller" = "Caller"
"variable.title.dance_choreographer" = "Dance Choreographer"
"variable.title.dance_choreography" = "Dance Choreography"
"variable.title.dance_crooked" = "Crooked"
"variable.title.dance_form" = "Dance Form"
"variable.title.dance_intro" = "Intro Beats"
"variable.title.dance_issong" = "Has Vocals"
"variable.title.dance_license" = "Dance License"
"variable.title.dance_potatoes" = "Potatoes"
"variable.title.dance_roles" = "Dance Roles"
"variable.title.dance_start" = "Dance Start Time"
"variable.title.dance_times" = "Dance Times"
"variable.title.dance_title" = "Dance Title"
